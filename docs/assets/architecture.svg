<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" role="img" aria-label="LlrpReaderPlatform layering and dependency diagram">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6B7B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="512" rx="16" fill="#FFFFFF"/>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <rect x="330" y="30" width="300" height="64" rx="12" fill="#6C5CE7"/>
    <text x="480" y="58" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">UI Consumers</text>
    <text x="480" y="80" text-anchor="middle" font-size="11" fill="#ffffff" opacity="0.95">App.Wpf today · Avalonia / WinUI / MAUI later</text>

    <rect x="330" y="150" width="300" height="64" rx="12" fill="#0984E3"/>
    <text x="480" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Services</text>
    <text x="480" y="200" text-anchor="middle" font-size="11" fill="#ffffff" opacity="0.95">lifecycle · settings · inventory · tag access</text>

    <rect x="60" y="280" width="200" height="64" rx="12" fill="#00B894"/>
    <text x="160" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Contracts</text>
    <text x="160" y="330" text-anchor="middle" font-size="11" fill="#ffffff" opacity="0.95">UI / SDK / vendor-agnostic</text>

    <rect x="380" y="280" width="200" height="64" rx="12" fill="#636E72"/>
    <text x="480" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Infrastructure</text>
    <text x="480" y="330" text-anchor="middle" font-size="11" fill="#ffffff" opacity="0.95">SQLite · discovery · logging</text>

    <rect x="700" y="280" width="200" height="64" rx="12" fill="#E17055"/>
    <text x="800" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Extensions.*</text>
    <text x="800" y="330" text-anchor="middle" font-size="11" fill="#ffffff" opacity="0.95">Impinj · Zebra · future</text>

    <rect x="140" y="420" width="300" height="64" rx="12" fill="#2D3436"/>
    <text x="290" y="448" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">LlrpSdk</text>
    <text x="290" y="470" text-anchor="middle" font-size="11" fill="#ffffff" opacity="0.95">core · standard LLRP adapter</text>

    <rect x="660" y="420" width="280" height="64" rx="12" fill="#2D3436"/>
    <text x="800" y="448" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">LlrpSdk.Extensions.*</text>
    <text x="800" y="470" text-anchor="middle" font-size="11" fill="#ffffff" opacity="0.95">Impinj · Zebra vendor adapters</text>

    <g fill="none" stroke="#5A6B7B" stroke-width="2" marker-end="url(#arr)">
      <path d="M480 94 V150"/>
      <path d="M400 214 L170 280"/>
      <path d="M480 214 V280"/>
      <path d="M560 214 L790 280"/>
      <path d="M345 214 H30 V452 H140"/>
      <path d="M800 344 V420"/>
    </g>

    <text x="30" y="500" font-size="11" fill="#5A6B7B">→ depends on · two SDK outlets: core LlrpSdk (Services) and LlrpSdk.Extensions.* (Extensions.*)</text>
  </g>
</svg>
