name: .NET CI

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
    branches:
      - master
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore LlrpReaderPlatform.slnx -p:EnableWindowsTargeting=true -p:UseLocalLlrpSdk=false

      - name: Build solution
        run: dotnet build LlrpReaderPlatform.slnx --no-restore --configuration Release -p:EnableWindowsTargeting=true -p:UseLocalLlrpSdk=false

      - name: Run automated tests
        run: dotnet test LlrpReaderPlatform.slnx --no-build --no-restore --configuration Release -p:EnableWindowsTargeting=true -p:UseLocalLlrpSdk=false --logger "trx;LogFileName=platform-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  build-maccatalyst:
    name: Build Mac Catalyst
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore MAUI workloads
        run: dotnet workload restore src/LlrpReaderManager/LlrpReaderManager.csproj

      - name: Restore MAUI project in NuGet mode
        run: dotnet restore src/LlrpReaderManager/LlrpReaderManager.csproj -p:EnableWindowsTargeting=true -p:UseLocalLlrpSdk=false

      - name: Build Mac Catalyst project
        run: dotnet build src/LlrpReaderManager/LlrpReaderManager.csproj --framework net10.0-maccatalyst --configuration Release --no-restore -p:UseLocalLlrpSdk=false
